name: rust

# Réécriture en Rust (dossier rust/) : tests et exécutables d'essai uniquement.
# Aucune release n'est publiée par ce workflow.
on:
  push:
    branches: [main]
    paths: ["rust/**", "settings.html", "icon.ico", "rsrc_windows_*.syso", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "settings.html", "icon.ico", "rsrc_windows_*.syso", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (partie indépendante de Windows)
        run: cargo test --locked

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests sous Windows
        run: cargo test --locked

  build:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    env:
      LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Éditeur de liens pour Windows (llvm-mingw, version et empreinte fixées)
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/llvm-mingw" && tar xJf /tmp/llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build Windows x64 + ARM64 (classique, installeur, portable)
        env:
          IW_VERSION: dev-rust-${{ github.sha }}
          CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER: x86_64-w64-mingw32-clang
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: aarch64-w64-mingw32-clang
        run: |
          mkdir -p dist
          for arch in x86_64 aarch64; do
            name=$([ "$arch" = x86_64 ] && echo x64 || echo arm64)
            for flavor in "" setup portable; do
              IW_FLAVOR=$flavor cargo build --locked --release --target "$arch-pc-windows-gnullvm"
              cp "target/$arch-pc-windows-gnullvm/release/ImmichWallpaper.exe" "dist/ImmichWallpaper-rust-${flavor:+$flavor-}$name.exe"
            done
          done
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ImmichWallpaper-rust-${{ github.sha }}
          path: rust/dist/*
