name: build

# Publication d'une release :
#  - automatiquement quand la version de version.go n'a pas encore de release (push sur main) ;
#  - ou en poussant un tag vX.Y.Z.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Lecture seule par défaut : seul le job « release » peut écrire, et seulement sur un push.
permissions:
  contents: read

# Les actions sont épinglées par SHA de commit (le tag est rappelé en commentaire) ;
# Dependabot propose leurs mises à jour. La version de Go est celle de go.mod (toolchain).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Dépendances
        run: |
          go mod download
          go mod verify

      - name: Vérifications
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
          go test -race ./...

      - name: Analyse statique et vulnérabilités connues
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows staticcheck ./...
          govulncheck ./...
          GOOS=windows govulncheck ./...

      - name: Fuzzing court des analyseurs binaires
        run: |
          go test -run '^$' -fuzz FuzzICC -fuzztime 30s .
          go test -run '^$' -fuzz FuzzImageMeta -fuzztime 30s .

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Tests sous Windows
        run: go test ./...

  build:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            V=$(sed -n 's/^var appVersion = "\(.*\)"$/\1/p' version.go)
            if [ -n "$V" ] && ! gh release view "v$V" >/dev/null 2>&1; then
              VERSION="$V"; RELEASE=true
            fi
          fi
          [ -n "$VERSION" ] || VERSION="dev-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION (release : $RELEASE)"

      - name: Build Windows x64 + ARM64
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            name=$([ "$arch" = amd64 ] && echo x64 || echo arm64)
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-H windowsgui -s -w -X main.appVersion=$VERSION" \
              -o "dist/ImmichWallpaper-$name.exe" .
          done
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ImmichWallpaper-${{ steps.version.outputs.version }}
          path: dist/*

  # Seul job avec un droit d'écriture ; jamais exécuté pour une pull request.
  # Pour exiger une approbation manuelle avant publication, ajouter ici « environment: release »
  # et protéger cet environnement dans les réglages du dépôt.
  release:
    needs: build
    if: needs.build.outputs.release == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # création du tag et de la release
      id-token: write # attestation de provenance
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ImmichWallpaper-${{ needs.build.outputs.version }}
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe

      - name: Release
        run: |
          # Une release publiée n'est jamais modifiée : les applis installées s'y fient.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà : elle n'est pas écrasée." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "Immich Wallpaper $TAG" --generate-notes
