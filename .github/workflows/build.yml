name: build

# Publication d'une release :
#  - automatiquement quand la version de version.go n'a pas encore de release (push sur main) ;
#  - ou en poussant un tag vX.Y.Z.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer le tag et la release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Dépendances
        run: go mod tidy

      - name: Vérifications
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
          go test ./...

      - name: Version
        id: version
        run: |
          RELEASE=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            V=$(sed -n 's/^var appVersion = "\(.*\)"$/\1/p' version.go)
            if [ -n "$V" ] && ! gh release view "v$V" >/dev/null 2>&1; then
              VERSION="$V"; RELEASE=true
            fi
          fi
          [ -n "$VERSION" ] || VERSION="dev-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION (release : $RELEASE)"

      - name: Build Windows x64 + ARM64
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            name=$([ "$arch" = amd64 ] && echo x64 || echo arm64)
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-H windowsgui -s -w -X main.appVersion=$VERSION" \
              -o "dist/ImmichWallpaper-$name.exe" .
          done
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ImmichWallpaper-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Immich Wallpaper $TAG" --generate-notes
          fi
