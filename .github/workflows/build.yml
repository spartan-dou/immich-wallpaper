name: build

# Publication d'une release :
#  - automatiquement quand la version de Cargo.toml n'a pas encore de release (push sur main) ;
#  - ou en poussant un tag vX.Y.Z.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Lecture seule par défaut : seul le job « release » peut écrire, et seulement sur un push.
permissions:
  contents: read

# Les actions sont épinglées par SHA de commit (le tag est rappelé en commentaire) ;
# Dependabot propose leurs mises à jour. La version de Rust est celle de rust-toolchain.toml
# (installée par rustup, présent sur les machines de GitHub).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Format et tests (partie indépendante de Windows)
        run: |
          cargo fmt --check
          cargo test --locked

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fenêtre de réglages comprise (créée, remplie, relue, enregistrée puis fermée).
      - name: Tests sous Windows
        run: cargo test --locked

  build:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            V=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            if [ -n "$V" ] && ! gh release view "v$V" >/dev/null 2>&1; then
              VERSION="$V"; RELEASE=true
            fi
          fi
          [ -n "$VERSION" ] || VERSION="dev-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION (release : $RELEASE)"

      - name: Éditeur de liens pour Windows (llvm-mingw, version et empreinte fixées)
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/llvm-mingw" && tar xJf /tmp/llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build Windows x64 + ARM64 (classique, installeur, portable)
        env:
          IW_VERSION: ${{ steps.version.outputs.version }}
          CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER: x86_64-w64-mingw32-clang
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: aarch64-w64-mingw32-clang
        run: |
          mkdir -p dist
          # Trois exécutables par architecture :
          #   ImmichWallpaper-<arch>.exe          exe classique (téléchargé par la mise à jour automatique)
          #   ImmichWallpaper-setup-<arch>.exe    installeur
          #   ImmichWallpaper-portable-<arch>.exe version portable (données à côté de l'exe)
          for arch in x86_64 aarch64; do
            name=$([ "$arch" = x86_64 ] && echo x64 || echo arm64)
            for flavor in "" setup portable; do
              IW_FLAVOR=$flavor cargo build --locked --release --target "$arch-pc-windows-gnullvm"
              cp "target/$arch-pc-windows-gnullvm/release/ImmichWallpaper.exe" "dist/ImmichWallpaper-${flavor:+$flavor-}$name.exe"
            done
          done

      - name: Zips portables (exe classique + portable.txt, à la manière d'omnictl)
        run: |
          # ImmichWallpaper-portable-<arch>.zip : à dézipper où l'on veut, rien à installer.
          # Le fichier portable.txt à côté de l'exe le rend portable et décrit ce qu'il fait
          # sur le PC. L'exe portable seul reste publié pour les copies qui se mettent à jour.
          for name in x64 arm64; do
            dir="portable-$name"
            mkdir -p "$dir"
            cp "dist/ImmichWallpaper-$name.exe" "$dir/ImmichWallpaper.exe"
            sed 's/$/\r/' packaging/portable.txt > "$dir/portable.txt" # fins de ligne Windows
            touch -d "@$(git log -1 --format=%ct)" "$dir"/*
            (cd "$dir" && zip -X -9 "../dist/ImmichWallpaper-portable-$name.zip" ImmichWallpaper.exe portable.txt)
            rm -r "$dir"
          done
          (cd dist && sha256sum *.exe *.zip > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ImmichWallpaper-${{ steps.version.outputs.version }}
          path: dist/*

  # Seul job avec un droit d'écriture ; jamais exécuté pour une pull request.
  # Pour exiger une approbation manuelle avant publication, ajouter ici « environment: release »
  # et protéger cet environnement dans les réglages du dépôt.
  release:
    needs: build
    if: needs.build.outputs.release == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # création du tag et de la release
      id-token: write # attestation de provenance
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ImmichWallpaper-${{ needs.build.outputs.version }}
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Release
        run: |
          # Une release publiée n'est jamais modifiée : les applis installées s'y fient.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà : elle n'est pas écrasée." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "Immich Wallpaper $TAG" --generate-notes
