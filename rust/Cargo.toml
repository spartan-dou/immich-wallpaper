[package]
name = "immich-wallpaper"
version = "1.8.0"
edition = "2021"
description = "Fond d'écran Windows tiré d'albums Immich"
publish = false

[[bin]]
name = "ImmichWallpaper"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
ab_glyph_rasterizer = "0.1.10"
base64 = "0.23.1"
fast_image_resize = "6.1.0"
fastrand = "2.5.0"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
ureq = { version = "3", default-features = false }
url = "2.5.8"

[target."cfg(windows)".dependencies]
native-tls = "0.2.18"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Storage",
    "Storage_Streams",
    "System_UserProfile",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_NetworkListManager",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.100.0"

# Décodage et redimensionnement restent rapides même dans les builds de test.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
